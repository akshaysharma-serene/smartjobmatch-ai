version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: smartjobmatch-postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: smartjobmatch
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: smartjobmatch-backend
    restart: always
    depends_on:
      db:
        condition: service_healthy
    environment:
      APP_ENV: production
      DATABASE_URL: postgresql://postgres:postgrespassword@db:5432/smartjobmatch
      SECRET_KEY: production-secret-key-change-this-value-in-prod-env
      ACCESS_TOKEN_EXPIRE_MINUTES: 1440
      SYNC_SCHEDULE_HOURS: 6
      ENABLE_SCHEDULED_SYNC: "True"
      LINKEDIN_CLIENT_ID: ""
      LINKEDIN_CLIENT_SECRET: ""
      LINKEDIN_API_TOKEN: ""
    ports:
      - "8000:8000"
    volumes:
      - ./Full_Stack_Software_Engineer.pdf:/app/Full_Stack_Software_Engineer.pdf:ro

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: smartjobmatch-frontend
    restart: always
    depends_on:
      - backend
    ports:
      - "3000:80"

volumes:
  pgdata:

